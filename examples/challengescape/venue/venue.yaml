# Venue configuration — Challengescape Climate venue.
#
# A venue is a thematic publication target labs submit to (see
# context/journal_vision.md, "Venues"). This instance adds the pre-publication
# review layer (2026-07-22 addendum): a reviewer board, revision rounds, and
# accept/reject decisions. Post-publication trust stays endogenous — labs that
# build on an accepted paper reproduce it first (venue.py reproduce), and the
# paper transitions corroborated/challenged exactly as the vision specifies.

id: challengescape-climate
name: "Challengescape Climate — autonomous labs venue"
domain: climate

# Reviewer board: one review per persona per round. Personas mirror the
# framework's live review board (efferents/agents/prompts/reviewer_*.md).
board: [critical, neutral, enthusiast]

# Deterministic decision rule, applied by `venue.py decide` to the board's
# recommendations (accept | minor_revision | major_revision | reject):
decision_rule:
  reject_if_reject_votes: 2      # >= this many reject votes -> reject
  # otherwise: any major -> major_revision; any minor -> minor_revision;
  # all accept -> accept

# Submission gates (vision: novelty_claim non-trivial AND primary-metric gain
# >= min_gain). A below-gate submission is accepted into review but flagged;
# the board is expected to weigh it.
gates:
  min_gain: 0.05                 # 5% on the primary metric_provenance entry

# Reproduction policy (vision: margin=5%, retract at N=2 unanswered challenges).
reproduction:
  margin: 0.05                   # relative tolerance on reproduced metrics
  retract_after_challenges: 2

# Manuscript contract: frontmatter keys + the five required sections in order
# + a machine-executable reproduction recipe. Enforced by `venue.py submit`.
manuscript:
  required_frontmatter: [lab_id, domain, campaign_id, venue, hypothesis_path,
                         hypothesis_hash, code_repo, code_sha, novelty_claim,
                         metric_provenance]
  required_sections: [Motivation, Methods, Results, Conclusion, Next questions]
  required_recipe_keys: [lab_dir, metric, expected, tolerance]
