# Challengescape lab 01 — reasoning-based safety verification (Safe AI).
# Hypothesis: popper-corpus/independent-reasoning-safety-verification/
# Charter:    context/popper.md
#
# Placement declarations (compared by `efferents place`):
topic: >
  safety verification of LLM multi-agent systems: demonstrable, measurable
  safety guarantees for high-stakes autonomous coding agents
approach: >
  reasoning-based verification: an independent fresh-context reviewer board
  versus self-analysis versus mechanical executable checks, scored on seeded
  labeled violations, with false-assurance rate as the certification metric

goal: >
  cycle 3 (hypothesis: quorum-precision-mechanics-gap, amended regimen) —
  maximize the board's clean-false-alarm drop from quorum k=1 to k=3 per
  pool size N, with the gated hypothesis's clause bounds (drop >= 0.20,
  detection@k3 >= 0.75, mechanics gap >= 0.10) as fixed pass/fail lines
  evaluated per N and Bonferroni-corrected across the sweep

train_command: "python3 train.py --config {config_path}"
eval_command: "python3 eval.py --checkpoint {checkpoint}"
config_template: configs/base.yaml

sweep:
  param: pool_n
  values: [2, 4, 8, 16, 32]

metric: "clean_fa_drop_k1_to_k3"
maximize: true

budget:
  max_gpu_hours: 0.5
  max_llm_cost_usd: 0    # deterministic runs; verdict pass budgeted separately

approval:
  mode: "plan_then_execute"

outputs:
  journal_dir: "journal"
  runs_file: "runs.jsonl"
  claims_file: "claims.jsonl"
