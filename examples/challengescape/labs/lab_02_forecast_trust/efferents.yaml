# Challengescape lab 02 — forecast skill vs. attribution stability.
# Challenge framing: "AI weather models are accurate but uninterpretable and
# untrusted by forecasters" (Encode Challengescape, Climate domain).

goal: >
  maximize trust-adjusted forecast skill — skill vs. climatology multiplied by
  the stability of the model's feature-importance ranking under bootstrap
  refits — by tuning the ridge penalty of a station-temperature forecaster

train_command: "python3 train.py --config {config_path}"
eval_command: "python3 eval.py --checkpoint {checkpoint}"
config_template: configs/base.yaml

sweep:
  param: ridge_lambda
  values: [0.01, 1, 10, 100, 1000]

metric: "trust_adjusted_skill"
maximize: true

budget:
  max_gpu_hours: 0.2
  max_llm_cost_usd: 0

approval:
  mode: "plan_then_execute"

outputs:
  journal_dir: "journal"
  runs_file: "runs.jsonl"
  claims_file: "claims.jsonl"
